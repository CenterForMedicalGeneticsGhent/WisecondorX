[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wisecondorx"
dynamic = ["version"]
description = "WisecondorX -- an evolved WISECONDOR"
readme = "README.md"
authors = [
    { name = "Matthias De Smet", email = "ict.cmgg@uzgent.be" },
    { name = "Lennart Raman" },
]
license = { file = "LICENSE.md" }
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "pysam>=0.23",
    "numpy>=2.4",
    "pandas>=3.0",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "ruff",
    "prek"
]

[project.scripts]
wisecondorx = "wisecondorx.main:app"
WisecondorX = "wisecondorx.main:app"
wisecondorX = "wisecondorx.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wisecondorx = ["*.R"]

[tool.setuptools.dynamic]
version = {attr = "wisecondorx.__version__"}

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
ignore = ["E266", "E501", "C901"]

# --- Pixi configuration ---------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10"
pysam = "0.23.*"
scipy = "1.17.*"
scikit-learn = "1.8.*"
numpy = "2.4.*"
pandas = "3.0.*"
matplotlib-base = "3.10.*"
r-jsonlite = ">=1.8"
r-png = "*"
bioconductor-dnacopy = ">=1.76"
typer = ">=0.24.0,<0.25"

[tool.pixi.pypi-dependencies]
wisecondorx = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
prek = "*"
ruff = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
lint = { cmd = "ruff check src/"}
test = { cmd = "PYTHONPATH=. pytest tests/", default-environment = "test" }
format = { cmd = "ruff format src/"}
docker-build = "docker build --platform linux/amd64 -t cmgg/wisecondorx:latest ."
