[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wisecondorx"
version = "1.3.0"
description = "WisecondorX -- an evolved WISECONDOR"
readme = "README.md"
authors = [
    { name = "Matthias De Smet", email = "ict.cmgg@uzgent.be" },
    { name = "Lennart Raman" },
]
license = { file = "LICENSE.md" }
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "scipy",
    "scikit-learn<=1.4.2",
    "pysam",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "ruff",
    "prek"
]

[project.scripts]
wisecondorx = "wisecondorx.main:main"
WisecondorX = "wisecondorx.main:main"
wisecondorX = "wisecondorx.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wisecondorx = ["*.R"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
ignore = ["E266", "E501", "C901"]

# --- Pixi configuration ---------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.10"
pysam = "0.22.*"
scipy = "1.13.*"
scikit-learn = "1.4.*"
numpy = "1.26.*"
pandas = "*"
matplotlib-base = "3.8.*"
r-jsonlite = "1.8.*"
r-png = "*"
bioconductor-dnacopy = ">=1.76"

[tool.pixi.pypi-dependencies]
wisecondorx = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
prek = "*"
ruff = "*"
pytest = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check src/"
format = "ruff format src/"
test = "pytest tests/"
fix = "ruff check --fix src/"
hooks = "prek run --all-files"